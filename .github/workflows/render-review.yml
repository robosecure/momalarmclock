name: Render status successors for review only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: status-v2-review-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate pins and reviewed timing before encoding
        run: python3 .github/render-status-v2/render.py --check
      - name: Ensure standard FFmpeg is available
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          ffmpeg -version
      - name: Render parent then cartoon
        run: python3 .github/render-status-v2/render.py --render --output "$RUNNER_TEMP/momalarm-status-v2"
      - name: Retain all available review outputs and failure logs for one day
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: status-v2-review-${{ github.run_id }}
          path: ${{ runner.temp }}/momalarm-status-v2/
          retention-days: 1
          if-no-files-found: ignore
          compression-level: 0
