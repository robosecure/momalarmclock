name: Render status successors for review only
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Reviewed task to run
        required: true
        type: choice
        default: status-v2
        options:
          - status-v2
          - fullfilm-input-qa
permissions:
  contents: read
concurrency:
  group: status-v2-review-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reject unknown task modes
        shell: bash
        env:
          RENDER_MODE: ${{ inputs.mode }}
        run: |
          case "$RENDER_MODE" in
            status-v2|fullfilm-input-qa) ;;
            *) echo "Unsupported task mode" >&2; exit 1 ;;
          esac
      - name: Check out exact workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate pins and reviewed timing before encoding
        if: inputs.mode == 'status-v2'
        run: python3 .github/render-status-v2/render.py --check
      - name: Validate exact full-film production inputs without encoding
        if: inputs.mode == 'fullfilm-input-qa'
        run: python3 .github/fullfilm-input-qa/qa.py --check
      - name: Ensure standard FFmpeg is available
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          ffmpeg -version
      - name: Render parent then cartoon
        if: inputs.mode == 'status-v2'
        run: python3 .github/render-status-v2/render.py --render --output "$RUNNER_TEMP/momalarm-status-v2"
      - name: Check narration and encode only the three-second endcard
        if: inputs.mode == 'fullfilm-input-qa'
        run: python3 .github/fullfilm-input-qa/qa.py --run --output "$RUNNER_TEMP/momalarm-fullfilm-input-qa"
      - name: Retain all available review outputs and failure logs for one day
        if: always() && inputs.mode == 'status-v2'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: status-v2-review-${{ github.run_id }}
          path: ${{ runner.temp }}/momalarm-status-v2/
          retention-days: 1
          if-no-files-found: ignore
          compression-level: 0
      - name: Retain input-QA output and raw failure logs for one day
        if: always() && inputs.mode == 'fullfilm-input-qa'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fullfilm-input-qa-${{ github.run_id }}
          path: ${{ runner.temp }}/momalarm-fullfilm-input-qa/
          retention-days: 1
          if-no-files-found: ignore
          compression-level: 0
